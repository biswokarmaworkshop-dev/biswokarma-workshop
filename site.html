<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#171a1d" />
    <meta name="description" content="Vehicle servicing in Gorkha, Nepal for JCB, buses, trucks, tractors, motorcycles and more. Contact Biswokarma Workshop." />
    <title>Biswokarma Workshop | Vehicle Service & Spare Parts</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f1eee6;
        --muted: #b6b1a6;
        --faint: #77746d;
        --panel: #24272a;
        --panel-raised: #2c3033;
        --panel-inset: #181b1e;
        --edge: #494a48;
        --amber: #e7a84d;
        --amber-bright: #ffc56b;
        --amber-ink: #21170c;
        --teal: #5dd6c4;
        --blue: #81b8ff;
        --green: #7abe8c;
        --red: #ff9c85;
        --radius: 20px;
        --shadow-raised: 8px 9px 18px #111315, -5px -5px 14px #303438;
        --shadow-inset: inset 4px 5px 10px #111315, inset -3px -3px 8px #303438;
        font-family: Inter, ui-sans-serif, system-ui, "Segoe UI", sans-serif;
        background: #171a1d;
        color: var(--ink);
      }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background:
          radial-gradient(ellipse at 12% 0%, rgba(231,168,77,.12), transparent 32rem),
          radial-gradient(ellipse at 100% 44%, rgba(119,137,129,.08), transparent 35rem),
          repeating-linear-gradient(135deg, rgba(255,255,255,.014) 0 1px, transparent 1px 5px),
          #171a1d;
      }
      body, button, input, select, textarea { font: inherit; }
      button, a, input, select, textarea { -webkit-tap-highlight-color: transparent; }
      button, a { touch-action: manipulation; }
      a { color: var(--amber-bright); text-decoration: none; }
      .footer-contact a[href^="mailto:"] { color: var(--teal); }
      button { color: inherit; }
      button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
        outline: 3px solid var(--amber-bright);
        outline-offset: 3px;
      }
      .skip-link {
        position: fixed; z-index: 50; top: 8px; left: 8px; padding: 12px 16px;
        transform: translateY(-160%); background: var(--amber-bright); color: #171a1d; border-radius: 10px;
      }
      .skip-link:focus { transform: translateY(0); }
      .site-shell { width: min(1180px, 100% - 40px); margin: 0 auto; }
      .site-header {
        position: sticky; top: 0; z-index: 20; border-bottom: 1px solid rgba(231,168,77,.19);
        background: rgba(23,26,29,.93); backdrop-filter: blur(16px);
      }
      .header-inner { min-height: 76px; display: flex; align-items: center; gap: 22px; }
      .brand { display: flex; align-items: center; gap: 12px; color: var(--ink); margin-right: auto; }
      .brand-mark {
        display: grid; place-items: center; width: 44px; height: 44px; border-radius: 14px;
        border: 1px solid #686052; background:
          radial-gradient(circle at 36% 32%, #50504b, #26292b 60%, #17191b);
        box-shadow: inset 2px 2px 3px rgba(255,255,255,.18), inset -3px -3px 5px #111315, 2px 3px 6px #101112;
        color: var(--amber-bright); font-size: 22px;
      }
      .brand-copy strong { display: block; font-size: 16px; letter-spacing: .13em; }
      .brand-copy span { display: block; color: var(--muted); font-size: 10px; letter-spacing: .2em; text-transform: uppercase; }
      .site-nav { display: flex; align-items: center; gap: 6px; }
      .nav-link { min-height: 44px; display: inline-flex; align-items: center; padding: 0 12px; color: var(--muted); border-radius: 11px; }
      .nav-link:hover, .nav-link[aria-current="page"] { color: var(--ink); background: #292c2f; box-shadow: inset 0 1px rgba(255,255,255,.07); }
      .control, .control-link {
        min-height: 46px; display: inline-flex; align-items: center; justify-content: center; gap: 9px;
        padding: 0 17px; border: 1px solid #68583e; border-radius: 13px; cursor: pointer;
        font-weight: 750; color: var(--amber-ink); background: linear-gradient(145deg, #ffc671, #d8953e);
        box-shadow: inset 1px 1px rgba(255,255,255,.55), inset -2px -3px 4px rgba(113,65,20,.38), 3px 4px 8px #111315;
        transition: transform .16s ease, filter .16s ease, box-shadow .16s ease;
      }
      .control:hover, .control-link:hover { transform: translateY(-1px); filter: brightness(1.07); box-shadow: inset 1px 1px rgba(255,255,255,.48), 0 0 0 1px rgba(255,120,126,.28), 0 0 18px rgba(224,63,75,.15), 3px 5px 12px #101112; }
      .control:active, .control-link:active { transform: translateY(1px); box-shadow: var(--shadow-inset); }
      .control.secondary, .control-link.secondary {
        color: var(--ink); background: linear-gradient(145deg, #353a3d, #24272a); border-color: #505150;
        box-shadow: inset 1px 1px rgba(255,255,255,.12), inset -2px -3px 5px #17191b, 3px 4px 8px #101112;
      }
      .control.quiet, .control-link.quiet { color: var(--muted); background: #222629; border-color: #414447; box-shadow: var(--shadow-raised); }
      .nav-toggle { display: none; }
      main { min-height: 66vh; padding: 38px 0 76px; }
      .eyebrow { color: var(--amber-bright); font-size: 11px; font-weight: 800; letter-spacing: .17em; text-transform: uppercase; }
      .page-title { margin: 12px 0; font-size: clamp(2rem, 5.6vw, 4.2rem); letter-spacing: -.055em; line-height: 1.03; }
      .lede { max-width: 650px; color: var(--muted); font-size: clamp(1rem, 2vw, 1.15rem); line-height: 1.65; }
      .hero {
        position: relative; isolation: isolate; overflow: hidden; display: grid;
        grid-template-columns: 1.05fr .95fr; align-items: center; gap: 26px; min-height: 430px;
        padding: clamp(28px, 5vw, 64px); border: 1px solid #574447; border-radius: 28px;
        background:
          radial-gradient(ellipse at 78% 46%, rgba(202,50,63,.18), transparent 40%),
          radial-gradient(ellipse at 7% 12%, rgba(255,255,255,.08), transparent 34%),
          repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 4px),
          linear-gradient(135deg, #303234, #191b1e 66%, #242326);
        box-shadow: 12px 14px 25px rgba(0,0,0,.43), inset 1px 1px rgba(255,255,255,.11), inset -2px -3px rgba(0,0,0,.42);
      }
      .hero::before { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; opacity: .35; background: repeating-linear-gradient(112deg, transparent 0 24px, rgba(255,255,255,.018) 25px, transparent 26px 48px); }
      .hero h1 { margin: 18px 0 14px; max-width: 680px; font-size: clamp(2.3rem, 5vw, 4rem); letter-spacing: -.065em; line-height: .99; }
      .hero h1 span { color: #e85e65; text-shadow: 0 0 25px rgba(236,63,75,.2); }
      .hero .lede { margin-bottom: 24px; }
      .hero-actions { display: flex; flex-wrap: wrap; gap: 12px; }
      .hero .control-link:not(.secondary) { color: #fff1f1; border-color: #a9444b; background: linear-gradient(145deg, #df686d, #84262e); box-shadow: inset 1px 1px rgba(255,255,255,.28), inset -2px -3px 5px rgba(44,9,13,.65), 3px 4px 9px #111315; }
      .hero .control-link:not(.secondary):hover { box-shadow: inset 1px 1px rgba(255,255,255,.35), 0 0 18px rgba(235,72,83,.32), 3px 5px 12px #101112; }
      .hero-visual {
        width: min(100%, 440px); min-height: 360px; aspect-ratio: 1.18; justify-self: center; position: relative;
        display: grid; place-items: center; isolation: isolate; overflow: hidden; border: 1px solid rgba(211,217,215,.14); border-radius: 22px;
        background: radial-gradient(ellipse at 50% 50%, rgba(185,50,60,.17), transparent 48%), repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 4px), linear-gradient(145deg, #2c2f31, #181a1c 72%);
        box-shadow: inset 0 1px rgba(255,255,255,.09), inset 0 -20px 38px rgba(0,0,0,.25), 0 14px 30px rgba(0,0,0,.28);
      }
      .hero-visual::before { content: ""; position: absolute; width: 76%; aspect-ratio: 1; border: 1px solid rgba(216,223,220,.09); border-radius: 50%; box-shadow: 0 0 0 24px rgba(216,223,220,.025), 0 0 0 58px rgba(216,223,220,.018), inset 0 0 38px rgba(255,255,255,.035); }
      .hero-visual::after { content: ""; position: absolute; z-index: 2; top: 0; bottom: 0; left: -45%; width: 26%; transform: skewX(-18deg); background: linear-gradient(90deg, transparent, rgba(255,99,108,.14), transparent); pointer-events: none; }
      .workshop-visual-mark { position: relative; z-index: 1; width: min(68%, 290px); aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; border: 1px solid rgba(225,229,226,.3); border-radius: 50%; color: #e3e4e1; background: radial-gradient(circle at 35% 28%, #46494a, #252729 57%, #17191a); box-shadow: inset 5px 6px 16px rgba(255,255,255,.12), inset -10px -12px 22px rgba(0,0,0,.75), 0 14px 26px rgba(0,0,0,.5), 0 0 40px rgba(200,55,64,.09); text-align: center; transform-style: preserve-3d; animation: workshop-mark-float 7s ease-in-out infinite; }
      .workshop-visual-mark::after { content: ""; position: absolute; inset: 0; border-radius: inherit; border: 1px solid rgba(255,255,255,.16); transform: translateZ(9px); pointer-events: none; }
      @keyframes workshop-mark-float { 0%, 100% { transform: perspective(800px) rotateY(-8deg) rotateX(3deg) translateY(0); } 50% { transform: perspective(800px) rotateY(8deg) rotateX(-3deg) translateY(-5px); } }
      .workshop-mark-ring { position: absolute; inset: 9%; border: 1px dashed rgba(235,94,101,.5); border-radius: 50%; animation: gear-turn 44s linear infinite; }
      .workshop-mark-name { font-size: clamp(1rem, 2.2vw, 1.45rem); font-weight: 900; letter-spacing: .14em; text-shadow: 0 2px 8px rgba(0,0,0,.75); }
      .workshop-mark-subtitle { color: #fff; font-size: clamp(1.45rem, 3vw, 2rem); font-weight: 950; letter-spacing: .2em; text-shadow: 0 3px 8px rgba(0,0,0,.8); }
      .workshop-mark-location { color: #e85e65; font-size: .65rem; font-weight: 800; letter-spacing: .18em; }
      .hero-visual-label { position: absolute; z-index: 3; color: #c4c7c5; font-size: .66rem; font-weight: 800; letter-spacing: .15em; text-transform: uppercase; }
      .hero-visual-label.top { top: 16px; left: 17px; }
      .hero-visual-label.bottom { right: 16px; bottom: 15px; color: #e85e65; }
      .hero-gear { position: absolute; z-index: 3; top: 43px; right: 17px; width: 50px; aspect-ratio: 1; display: grid; place-items: center; border: 1px solid #9b555b; border-radius: 50%; color: #211315; font-size: 1.2rem; background: radial-gradient(circle at 35% 30%, #f08a8e, #8f3d44 72%); box-shadow: inset 2px 2px 4px rgba(255,255,255,.3), inset -3px -4px 6px rgba(24,9,11,.7), 0 0 16px rgba(232,65,77,.15); animation: gear-turn 32s linear infinite; }
      .hero-gear-inner { display: grid; place-items: center; width: 58%; aspect-ratio: 1; border-radius: 50%; color: #f4a1a3; background: #222326; box-shadow: inset 2px 3px 6px #101112; font-size: .57rem; animation: gear-counter 32s linear infinite; }
      @keyframes gear-turn { to { transform: rotate(360deg); } }
      @keyframes gear-counter { to { transform: rotate(-360deg); } }
      .hero-status { display: flex; align-items: center; gap: 9px; margin-top: 24px; color: #c2c2bd; font-size: .78rem; letter-spacing: .11em; text-transform: uppercase; }
      .hero-status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #f07479; box-shadow: 0 0 11px rgba(240,72,84,.8); }
      .skip-intro { position: absolute; z-index: 4; top: 14px; right: 14px; min-height: 38px; padding: 0 12px; border: 1px solid rgba(255,255,255,.25); border-radius: 999px; color: #f2eeee; background: rgba(20,21,23,.8); cursor: pointer; font-size: .78rem; }
      .skip-intro:hover { border-color: #f07479; }
      .hero.is-entering .hero-copy { animation: hero-copy-in .72s .12s both cubic-bezier(.2,.72,.22,1); }
      .hero.is-entering .hero-visual { animation: hero-visual-in 1.15s both cubic-bezier(.2,.72,.22,1); }
      .hero.is-entering .hero-visual::after { animation: hero-light-sweep 1.2s .65s both ease-out; }
      .hero.is-entering .hero-status { animation: hero-copy-in .5s .72s both ease-out; }
      @keyframes hero-copy-in { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes hero-visual-in { from { opacity: .3; transform: translate3d(14px, 8px, 0) scale(.975); } to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); } }
      @keyframes hero-light-sweep { from { left: -45%; } to { left: 130%; } }
      .home-reveal { transition: opacity .65s ease, transform .65s cubic-bezier(.2,.72,.22,1); }
      .home-page.motion-ready .home-reveal:not(.is-visible) { opacity: 0; transform: translateY(17px); }
      .home-page.motion-ready .home-reveal.is-visible { opacity: 1; transform: translateY(0); }
      .product-card { transition: opacity .55s ease, transform .55s cubic-bezier(.2,.72,.22,1); }
      .product-grid.motion-ready .product-card:not(.is-visible) { opacity: 0; transform: translateY(15px); }
      .product-grid.motion-ready .product-card.is-visible { opacity: 1; transform: translateY(0); }
      @media (hover: hover) and (pointer: fine) {
        .product-card { transition: transform .22s ease, border-color .22s ease, box-shadow .22s ease; }
        .product-card:hover { transform: translateY(-4px) rotateX(1deg); border-color: #70605a; box-shadow: 9px 13px 22px rgba(0,0,0,.4), 0 0 0 1px rgba(240,116,121,.12); }
      }
      .section { margin-top: 72px; }
      .section-heading { display: flex; align-items: end; justify-content: space-between; gap: 18px; margin-bottom: 21px; }
      h2 { margin: 0; font-size: clamp(1.5rem, 3.2vw, 2.2rem); letter-spacing: -.04em; }
      .card-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; }
      .card-grid.vehicle-grid { grid-template-columns: repeat(auto-fit, minmax(195px, 1fr)); }
      .machine-card, .surface, .product-card, .inquiry-card, .dashboard-panel {
        border: 1px solid #444849; border-radius: var(--radius);
        background: linear-gradient(145deg, #2a2e30, #202326); box-shadow: var(--shadow-raised);
      }
      .machine-card { padding: 22px; min-height: 190px; }
      .machine-icon { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 14px; margin-bottom: 19px; color: var(--amber-bright); background: #242729; box-shadow: var(--shadow-inset); font-size: 21px; }
      .machine-card p { color: var(--muted); line-height: 1.6; }
      .vehicle-grid .machine-card { min-height: 170px; border-top-color: #865158; }
      .vehicle-link { display: flex; flex-direction: column; color: var(--ink); transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease; }
      .vehicle-link:hover, .vehicle-link:focus-visible { color: var(--ink); border-color: #d45c65; transform: translateY(-3px); box-shadow: var(--shadow-raised), 0 0 18px rgba(220,70,80,.15); }
      .vehicle-link-action { margin-top: auto; padding-top: 13px; color: #f07479; font-size: .85rem; font-weight: 800; }
      .workshop-about { padding: clamp(24px, 4vw, 42px); border-color: #554448; background: radial-gradient(ellipse at 94% 5%, rgba(200,55,64,.13), transparent 38%), linear-gradient(145deg, #282b2d, #1c1e20); }
      .workshop-about h2 { max-width: 720px; margin: 10px 0; font-size: clamp(1.6rem, 3.5vw, 2.5rem); }
      .workshop-about .lede { margin: 10px 0 20px; }
      .note-bar { display: flex; align-items: flex-start; gap: 12px; margin-top: 20px; padding: 17px 19px; border: 1px solid #62543d; border-radius: 15px; color: #ead6b6; background: rgba(117,83,38,.16); }
      .page-intro { margin-bottom: 28px; }
      .catalog-controls { display: grid; grid-template-columns: minmax(200px, 1fr) minmax(190px, 260px); gap: 13px; padding: 16px; margin-bottom: 22px; }
      .surface { background: #222629; box-shadow: var(--shadow-inset); }
      .field { display: grid; gap: 7px; }
      .field label { font-size: .84rem; font-weight: 720; color: #ded8cb; }
      .field input, .field select, .field textarea {
        width: 100%; min-height: 48px; padding: 12px 13px; border: 1px solid #515454; border-radius: 11px;
        color: var(--ink); background: #191c1f; box-shadow: inset 2px 3px 6px #111315, inset -1px -1px 3px #292c2f;
      }
      .field textarea { min-height: 122px; resize: vertical; }
      .field input::placeholder, .field textarea::placeholder { color: #88847b; }
      .coverage-note { padding: 16px; border: 1px solid rgba(240,116,121,.4); border-radius: 13px; background: rgba(200,55,64,.08); }
      .coverage-check { display: flex; align-items: flex-start; gap: 11px; color: var(--ink); cursor: pointer; line-height: 1.55; }
      .coverage-check input { flex: 0 0 auto; width: 21px; height: 21px; min-height: 21px; margin: 1px 0 0; accent-color: #e85e65; }
      .coverage-note .form-note { margin-bottom: 0; }
      .product-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
      .product-card { padding: 20px; min-height: 225px; display: flex; flex-direction: column; }
      .part-stamp { display: inline-flex; align-self: flex-start; padding: 5px 8px; border-radius: 7px; color: var(--amber-bright); background: #1a1d1f; box-shadow: var(--shadow-inset); font-size: .7rem; font-weight: 800; letter-spacing: .08em; }
      .product-card h3 { margin: 17px 0 5px; font-size: 1.12rem; }
      .product-card p { color: var(--muted); font-size: .9rem; line-height: 1.55; margin: 6px 0 19px; }
      .product-bottom { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: auto; }
      .category-label { color: var(--faint); font-size: .75rem; }
      .inquiry-layout { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(250px, .7fr); align-items: start; gap: 20px; }
      .inquiry-card { padding: clamp(20px, 4vw, 34px); }
      .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 17px; }
      .field.full { grid-column: 1 / -1; }
      .form-note { color: var(--muted); font-size: .84rem; line-height: 1.6; }
      .form-status { min-height: 25px; margin: 10px 0; font-size: .92rem; }
      .form-status.error { color: var(--red); }
      .form-status.success { color: var(--green); }
      .contact-card { padding: 24px; }
      .contact-card p { color: var(--muted); line-height: 1.7; }
      .contact-line { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px; }
      .login-wrap { width: min(520px, 100%); margin: 10px auto; }
      .login-card { padding: clamp(23px, 5vw, 38px); }
      .login-card h1 { margin: 10px 0; font-size: 2.3rem; }
      .login-form { display: grid; gap: 16px; margin-top: 24px; }
      .password-row { position: relative; width: 100%; }
      .password-row input { width: 100%; min-width: 0; padding-right: 54px; }
      .password-toggle { position: absolute; top: 50%; right: 7px; width: 38px; height: 38px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 9px; color: var(--muted); background: transparent; cursor: pointer; transform: translateY(-50%); }
      .password-toggle:hover { color: var(--ink); background: rgba(255,255,255,.07); }
      .password-toggle:focus-visible { outline-offset: 0; }
      .password-toggle svg { width: 20px; height: 20px; }
      .role-switch { display: flex; gap: 8px; padding: 5px; border-radius: 13px; background: #1a1d1f; box-shadow: var(--shadow-inset); }
      .role-switch button { flex: 1; min-height: 44px; border: 0; border-radius: 9px; color: var(--muted); background: transparent; cursor: pointer; }
      .role-switch button[aria-pressed="true"] { color: var(--amber-bright); background: #303335; box-shadow: 2px 3px 6px #111315, inset 1px 1px rgba(255,255,255,.1); }
      .dashboard-shell { display: grid; grid-template-columns: 232px minmax(0,1fr); gap: 22px; }
      .dashboard-nav { align-self: start; position: sticky; top: 96px; padding: 13px; }
      .dashboard-nav button { width: 100%; min-height: 46px; text-align: left; margin: 3px 0; padding: 0 13px; border: 1px solid transparent; border-radius: 11px; background: transparent; color: var(--muted); cursor: pointer; }
      .dashboard-nav button[aria-current="page"] { color: var(--amber-bright); border-color: #5a4b36; background: #303130; box-shadow: inset 1px 1px rgba(255,255,255,.07); }
      .dashboard-main { min-width: 0; }
      .dashboard-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px; }
      .dashboard-panel { padding: 22px; margin-bottom: 17px; overflow-x: auto; }
      .stat-grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 13px; margin: 18px 0; }
      .stat { min-height: 105px; padding: 16px; border-radius: 14px; background: #202326; box-shadow: var(--shadow-inset); }
      .stat small { color: var(--muted); }
      .stat strong { display: block; margin-top: 8px; font-size: 1.45rem; }
      table { width: 100%; border-collapse: collapse; min-width: 540px; }
      th, td { padding: 12px 10px; border-bottom: 1px solid #424649; text-align: left; vertical-align: top; }
      th { color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .07em; }
      .empty-state { padding: 28px 15px; color: var(--muted); text-align: center; }
      .dashboard-toolbar { display: flex; flex-wrap: wrap; gap: 11px; align-items: center; margin: 15px 0; }
      .dashboard-toolbar .field { min-width: 160px; flex: 1; }
      .dashboard-toolbar .control { align-self: end; }
      .settings-form { display: grid; gap: 16px; max-width: 620px; margin-top: 20px; }
      .inventory-search { max-width: 420px; margin: 18px 0; }
      .inventory-viewer { display: grid; grid-template-columns: minmax(150px, .65fr) minmax(0, 1.35fr); align-items: center; gap: 20px; padding: 18px; margin: 18px 0; overflow: hidden; }
