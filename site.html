<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#171a1d" />
    <meta name="description" content="Motorcycle parts, workshop service and repair in Gorkha, Nepal. Ask Biswokarma Workshop to confirm fitment, price and availability." />
    <title>Biswokarma Workshop | Motorcycle Parts & Service</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f1eee6;
        --muted: #b6b1a6;
        --faint: #77746d;
        --panel: #24272a;
        --panel-raised: #2c3033;
        --panel-inset: #181b1e;
        --edge: #494a48;
        --amber: #e7a84d;
        --amber-bright: #ffc56b;
        --amber-ink: #21170c;
        --green: #7abe8c;
        --red: #ff9c85;
        --radius: 20px;
        --shadow-raised: 8px 9px 18px #111315, -5px -5px 14px #303438;
        --shadow-inset: inset 4px 5px 10px #111315, inset -3px -3px 8px #303438;
        font-family: Inter, ui-sans-serif, system-ui, "Segoe UI", sans-serif;
        background: #171a1d;
        color: var(--ink);
      }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background:
          radial-gradient(ellipse at 12% 0%, rgba(231,168,77,.12), transparent 32rem),
          radial-gradient(ellipse at 100% 44%, rgba(119,137,129,.08), transparent 35rem),
          repeating-linear-gradient(135deg, rgba(255,255,255,.014) 0 1px, transparent 1px 5px),
          #171a1d;
      }
      body, button, input, select, textarea { font: inherit; }
      button, a, input, select, textarea { -webkit-tap-highlight-color: transparent; }
      button, a { touch-action: manipulation; }
      a { color: var(--amber-bright); text-decoration: none; }
      button { color: inherit; }
      button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
        outline: 3px solid var(--amber-bright);
        outline-offset: 3px;
      }
      .skip-link {
        position: fixed; z-index: 50; top: 8px; left: 8px; padding: 12px 16px;
        transform: translateY(-160%); background: var(--amber-bright); color: #171a1d; border-radius: 10px;
      }
      .skip-link:focus { transform: translateY(0); }
      .site-shell { width: min(1180px, 100% - 40px); margin: 0 auto; }
      .site-header {
        position: sticky; top: 0; z-index: 20; border-bottom: 1px solid rgba(231,168,77,.19);
        background: rgba(23,26,29,.93); backdrop-filter: blur(16px);
      }
      .header-inner { min-height: 76px; display: flex; align-items: center; gap: 22px; }
      .brand { display: flex; align-items: center; gap: 12px; color: var(--ink); margin-right: auto; }
      .brand-mark {
        display: grid; place-items: center; width: 44px; height: 44px; border-radius: 14px;
        border: 1px solid #686052; background:
          radial-gradient(circle at 36% 32%, #50504b, #26292b 60%, #17191b);
        box-shadow: inset 2px 2px 3px rgba(255,255,255,.18), inset -3px -3px 5px #111315, 2px 3px 6px #101112;
        color: var(--amber-bright); font-size: 22px;
      }
      .brand-copy strong { display: block; font-size: 14px; letter-spacing: .13em; }
      .brand-copy span { display: block; color: var(--muted); font-size: 10px; letter-spacing: .2em; text-transform: uppercase; }
      .site-nav { display: flex; align-items: center; gap: 6px; }
      .nav-link { min-height: 44px; display: inline-flex; align-items: center; padding: 0 12px; color: var(--muted); border-radius: 11px; }
      .nav-link:hover, .nav-link[aria-current="page"] { color: var(--ink); background: #292c2f; box-shadow: inset 0 1px rgba(255,255,255,.07); }
      .control, .control-link {
        min-height: 46px; display: inline-flex; align-items: center; justify-content: center; gap: 9px;
        padding: 0 17px; border: 1px solid #68583e; border-radius: 13px; cursor: pointer;
        font-weight: 750; color: var(--amber-ink); background: linear-gradient(145deg, #ffc671, #d8953e);
        box-shadow: inset 1px 1px rgba(255,255,255,.55), inset -2px -3px 4px rgba(113,65,20,.38), 3px 4px 8px #111315;
        transition: transform .16s ease, filter .16s ease;
      }
      .control:hover, .control-link:hover { transform: translateY(-1px); filter: brightness(1.07); }
      .control:active, .control-link:active { transform: translateY(1px); box-shadow: var(--shadow-inset); }
      .control.secondary, .control-link.secondary {
        color: var(--ink); background: linear-gradient(145deg, #353a3d, #24272a); border-color: #505150;
        box-shadow: inset 1px 1px rgba(255,255,255,.12), inset -2px -3px 5px #17191b, 3px 4px 8px #101112;
      }
      .control.quiet, .control-link.quiet { color: var(--muted); background: #222629; border-color: #414447; box-shadow: var(--shadow-raised); }
      .nav-toggle { display: none; }
      main { min-height: 66vh; padding: 38px 0 76px; }
      .eyebrow { color: var(--amber-bright); font-size: 11px; font-weight: 800; letter-spacing: .17em; text-transform: uppercase; }
      .page-title { margin: 12px 0; font-size: clamp(2rem, 5.6vw, 4.2rem); letter-spacing: -.055em; line-height: 1.03; }
      .lede { max-width: 650px; color: var(--muted); font-size: clamp(1rem, 2vw, 1.15rem); line-height: 1.65; }
      .hero {
        position: relative; isolation: isolate; overflow: hidden; display: grid;
        grid-template-columns: 1.15fr .85fr; align-items: center; gap: 26px; min-height: 430px;
        padding: clamp(26px, 5vw, 60px); border: 1px solid #5b513e; border-radius: 28px;
        background:
          radial-gradient(ellipse at 83% 42%, rgba(231,168,77,.15), transparent 38%),
          repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 4px),
          linear-gradient(135deg, #2b2e30, #1c1f21 66%, #272723);
        box-shadow: 12px 14px 25px rgba(0,0,0,.43), inset 1px 1px rgba(255,255,255,.09), inset -2px -3px rgba(0,0,0,.42);
      }
      .hero h1 { margin: 18px 0 14px; max-width: 680px; font-size: clamp(2.5rem, 6.7vw, 5.25rem); letter-spacing: -.065em; line-height: .99; }
      .hero h1 span { color: var(--amber-bright); }
      .hero .lede { margin-bottom: 24px; }
      .hero-actions { display: flex; flex-wrap: wrap; gap: 12px; }
      .mechanical-art {
        width: min(100%, 390px); aspect-ratio: 1; justify-self: center; position: relative;
        display: grid; place-items: center; border-radius: 50%;
        background: radial-gradient(circle, #353738 0 42%, #1e2123 43% 63%, #323537 64% 65%, #1c1f21 66%);
        box-shadow: inset 8px 8px 22px #141618, inset -5px -5px 15px #414446, 8px 10px 23px #111315;
      }
      .mechanical-art::before, .mechanical-art::after { content: ""; position: absolute; border-radius: 50%; }
      .mechanical-art::before { inset: 9%; border: 1px dashed rgba(255,198,113,.44); }
      .mechanical-art::after { inset: 20%; border: 1px solid rgba(255,255,255,.09); }
      .gear {
        width: 49%; aspect-ratio: 1; display: grid; place-items: center; border-radius: 50%;
        color: #20170d; font-size: clamp(68px, 10vw, 112px);
        text-shadow: 1px 1px rgba(255,255,255,.4), -2px -2px rgba(69,43,15,.45);
        background: radial-gradient(circle at 35% 30%, #ffcd82, #c8822f 60%, #754819);
        box-shadow: inset 4px 5px 8px rgba(255,255,255,.33), inset -6px -8px 12px #744b20, 0 6px 14px #101112;
      }
      .gear-inner { display: grid; place-items: center; width: 43%; aspect-ratio: 1; border-radius: 50%; background: #25292b; box-shadow: var(--shadow-inset); color: var(--amber-bright); font-size: .28em; }
      .section { margin-top: 72px; }
      .section-heading { display: flex; align-items: end; justify-content: space-between; gap: 18px; margin-bottom: 21px; }
      h2 { margin: 0; font-size: clamp(1.5rem, 3.2vw, 2.2rem); letter-spacing: -.04em; }
      .card-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; }
      .machine-card, .surface, .product-card, .inquiry-card, .dashboard-panel {
        border: 1px solid #444849; border-radius: var(--radius);
        background: linear-gradient(145deg, #2a2e30, #202326); box-shadow: var(--shadow-raised);
      }
      .machine-card { padding: 22px; min-height: 190px; }
      .machine-icon { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 14px; margin-bottom: 19px; color: var(--amber-bright); background: #242729; box-shadow: var(--shadow-inset); font-size: 21px; }
      .machine-card p { color: var(--muted); line-height: 1.6; }
      .note-bar { display: flex; align-items: flex-start; gap: 12px; margin-top: 20px; padding: 17px 19px; border: 1px solid #62543d; border-radius: 15px; color: #ead6b6; background: rgba(117,83,38,.16); }
      .page-intro { margin-bottom: 28px; }
      .catalog-controls { display: grid; grid-template-columns: minmax(200px, 1fr) minmax(190px, 260px); gap: 13px; padding: 16px; margin-bottom: 22px; }
      .surface { background: #222629; box-shadow: var(--shadow-inset); }
      .field { display: grid; gap: 7px; }
      .field label { font-size: .84rem; font-weight: 720; color: #ded8cb; }
      .field input, .field select, .field textarea {
        width: 100%; min-height: 48px; padding: 12px 13px; border: 1px solid #515454; border-radius: 11px;
        color: var(--ink); background: #191c1f; box-shadow: inset 2px 3px 6px #111315, inset -1px -1px 3px #292c2f;
      }
      .field textarea { min-height: 122px; resize: vertical; }
      .field input::placeholder, .field textarea::placeholder { color: #88847b; }
      .product-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
      .product-card { padding: 20px; min-height: 225px; display: flex; flex-direction: column; }
      .part-stamp { display: inline-flex; align-self: flex-start; padding: 5px 8px; border-radius: 7px; color: var(--amber-bright); background: #1a1d1f; box-shadow: var(--shadow-inset); font-size: .7rem; font-weight: 800; letter-spacing: .08em; }
      .product-card h3 { margin: 17px 0 5px; font-size: 1.12rem; }
      .product-card p { color: var(--muted); font-size: .9rem; line-height: 1.55; margin: 6px 0 19px; }
      .product-bottom { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: auto; }
      .category-label { color: var(--faint); font-size: .75rem; }
      .inquiry-layout { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(250px, .7fr); align-items: start; gap: 20px; }
      .inquiry-card { padding: clamp(20px, 4vw, 34px); }
      .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 17px; }
      .field.full { grid-column: 1 / -1; }
      .form-note { color: var(--muted); font-size: .84rem; line-height: 1.6; }
      .form-status { min-height: 25px; margin: 10px 0; font-size: .92rem; }
      .form-status.error { color: var(--red); }
      .form-status.success { color: var(--green); }
      .contact-card { padding: 24px; }
      .contact-card p { color: var(--muted); line-height: 1.7; }
      .contact-line { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px; }
      .login-wrap { width: min(520px, 100%); margin: 10px auto; }
      .login-card { padding: clamp(23px, 5vw, 38px); }
      .login-card h1 { margin: 10px 0; font-size: 2.3rem; }
      .login-form { display: grid; gap: 16px; margin-top: 24px; }
      .password-row { display: flex; align-items: end; gap: 8px; }
      .password-row input { flex: 1; min-width: 0; }
      .role-switch { display: flex; gap: 8px; padding: 5px; border-radius: 13px; background: #1a1d1f; box-shadow: var(--shadow-inset); }
      .role-switch button { flex: 1; min-height: 44px; border: 0; border-radius: 9px; color: var(--muted); background: transparent; cursor: pointer; }
      .role-switch button[aria-pressed="true"] { color: var(--amber-bright); background: #303335; box-shadow: 2px 3px 6px #111315, inset 1px 1px rgba(255,255,255,.1); }
      .dashboard-shell { display: grid; grid-template-columns: 232px minmax(0,1fr); gap: 22px; }
      .dashboard-nav { align-self: start; position: sticky; top: 96px; padding: 13px; }
      .dashboard-nav button { width: 100%; min-height: 46px; text-align: left; margin: 3px 0; padding: 0 13px; border: 1px solid transparent; border-radius: 11px; background: transparent; color: var(--muted); cursor: pointer; }
      .dashboard-nav button[aria-current="page"] { color: var(--amber-bright); border-color: #5a4b36; background: #303130; box-shadow: inset 1px 1px rgba(255,255,255,.07); }
      .dashboard-main { min-width: 0; }
      .dashboard-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px; }
      .dashboard-panel { padding: 22px; margin-bottom: 17px; overflow-x: auto; }
      .stat-grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 13px; margin: 18px 0; }
      .stat { min-height: 105px; padding: 16px; border-radius: 14px; background: #202326; box-shadow: var(--shadow-inset); }
      .stat small { color: var(--muted); }
      .stat strong { display: block; margin-top: 8px; font-size: 1.45rem; }
      table { width: 100%; border-collapse: collapse; min-width: 540px; }
      th, td { padding: 12px 10px; border-bottom: 1px solid #424649; text-align: left; vertical-align: top; }
      th { color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .07em; }
      .empty-state { padding: 28px 15px; color: var(--muted); text-align: center; }
      .dashboard-toolbar { display: flex; flex-wrap: wrap; gap: 11px; align-items: center; margin: 15px 0; }
      .dashboard-toolbar .field { min-width: 160px; flex: 1; }
      .site-footer { border-top: 1px solid #373a3d; padding: 30px 0 42px; color: var(--muted); }
      .footer-inner { display: flex; align-items: flex-start; justify-content: space-between; gap: 25px; }
      .footer-contact { display: flex; flex-wrap: wrap; gap: 12px; }
      .loading { min-height: 60vh; display: grid; place-items: center; color: var(--muted); }
      .toast { position: fixed; z-index: 30; right: 18px; bottom: 18px; max-width: min(420px, calc(100% - 36px)); padding: 14px 17px; border-radius: 12px; border: 1px solid #63563f; background: #25282a; box-shadow: var(--shadow-raised); }
      @media (max-width: 850px) {
        .site-shell { width: min(100% - 28px, 700px); }
        .header-inner { min-height: 68px; gap: 9px; }
        .site-nav { display: none; position: absolute; inset: 68px 0 auto; padding: 10px 14px 16px; background: #1a1d1f; border-bottom: 1px solid #45413a; box-shadow: 0 12px 20px rgba(0,0,0,.35); }
        .site-nav.open { display: grid; grid-template-columns: repeat(2, 1fr); }
        .site-nav .nav-link { justify-content: center; }
        .nav-toggle { display: inline-flex; min-width: 46px; min-height: 46px; align-items: center; justify-content: center; border: 1px solid #505150; border-radius: 12px; background: #292c2f; box-shadow: var(--shadow-raised); cursor: pointer; }
        .hero { grid-template-columns: 1fr; min-height: 0; }
        .mechanical-art { width: min(64vw, 290px); grid-row: 1; }
        .card-grid, .product-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
        .dashboard-shell { grid-template-columns: 1fr; }
        .dashboard-nav { position: static; display: flex; gap: 4px; overflow-x: auto; padding: 8px; }
        .dashboard-nav button { flex: 0 0 auto; width: auto; white-space: nowrap; }
      }
      @media (max-width: 560px) {
        .site-shell { width: calc(100% - 24px); }
        main { padding: 24px 0 54px; }
        .brand-mark { width: 40px; height: 40px; }
        .brand-copy strong { font-size: 12px; }
        .brand-copy span { font-size: 9px; }
        .header-inner > .control-link { padding: 0 11px; min-height: 42px; font-size: .85rem; }
        .hero { padding: 22px 19px; border-radius: 21px; }
        .hero-actions { display: grid; grid-template-columns: 1fr; }
        .section { margin-top: 51px; }
        .section-heading { align-items: flex-start; flex-direction: column; }
        .card-grid, .product-grid, .form-grid, .inquiry-layout, .catalog-controls { grid-template-columns: 1fr; }
        .machine-card { min-height: auto; }
        .field.full { grid-column: auto; }
        .stat-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
        .dashboard-panel { padding: 16px; }
        .footer-inner { flex-direction: column; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
      }
    </style>
  </head>

    <a class="skip-link" href="#main-content">Skip to content</a>

    <script src="/vendor/react.production.min.js"></script>

</html>
