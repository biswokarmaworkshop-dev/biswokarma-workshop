services:
  - type: web
    name: biswokarma-workshop
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: biswokarma-db
          property: connectionString
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: PORT
        value: 10000

databases:
  - name: biswokarma-db
    plan: free
    databaseName: biswokarma
