<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biswokarma Workshop Dashboard</title>
    <meta name="description" content="Biswokarma Workshop premium dashboard for parts, billing, inventory, customers, suppliers and reports." />
    <meta name="theme-color" content="#0f172a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #f3f5f8;
        --card: rgba(255,255,255,0.8);
        --card-strong: #ffffff;
        --soft: #edf2f7;
        --line: rgba(15,23,42,0.08);
        --text: #0f172a;
        --muted: #667085;
        --muted-2: #7c8aa4;
        --primary: #101827;
        --primary-soft: #eaf0ff;
        --accent: #f59e0b;
        --accent-soft: #fff2d9;
        --green: #16a34a;
        --green-soft: #eafaf1;
        --blue: #2563eb;
        --blue-soft: #edf5ff;
        --red: #dc2626;
        --red-soft: #fff0f0;
        --purple: #7c3aed;
        --purple-soft: #f3ebff;
        --shadow: 0 16px 30px rgba(15,23,42,0.08);
      }
      html[data-theme="dark"] {
        --bg: #0b1220;
        --card: rgba(17,24,39,0.78);
        --card-strong: #111827;
        --soft: #101b2e;
        --line: rgba(148,163,184,0.16);
        --text: #edf3ff;
        --muted: #a4b0c3;
        --muted-2: #7f8ca6;
        --primary: #eaf0ff;
        --primary-soft: #102038;
        --accent: #f8ba5d;
        --accent-soft: rgba(248,186,93,0.12);
        --green: #4ade80;
        --green-soft: rgba(74,222,128,0.09);
        --blue: #7ab2ff;
        --blue-soft: rgba(122,178,255,0.12);
        --red: #f87171;
        --red-soft: rgba(248,113,113,0.1);
        --purple: #c4b5fd;
        --purple-soft: rgba(196,181,253,0.12);
        --shadow: 0 16px 30px rgba(2,6,23,0.42);
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: 'Inter', sans-serif;
      }
      body {
        background:
          radial-gradient(circle at top left, rgba(245,158,11,0.12), transparent 18%),
          radial-gradient(circle at bottom right, rgba(37,99,235,0.08), transparent 22%),
          var(--bg);
      }
      button, input, select { font: inherit; }
      #root { min-height: 100vh; }
      .app-shell { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
      .sidebar {
        position: sticky;
        top: 0;
        height: 100vh;
        padding: 18px 14px;
        border-right: 1px solid var(--line);
        background: rgba(255,255,255,0.38);
        backdrop-filter: blur(12px);
      }
      html[data-theme="dark"] .sidebar { background: rgba(15,23,42,0.52); }
      .brand { display: flex; align-items: center; gap: 12px; margin: 4px 8px 18px; }
      .brand-mark {
        width: 38px; height: 38px; border-radius: 12px; display:grid; place-items:center;
        background: linear-gradient(135deg, #111827, #2d3748); color:#f9d37b; font-weight:800;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 10px 20px rgba(15,23,42,0.12);
      }
      .brand-copy strong { display:block; font-size: .98rem; }
      .brand-copy span { display:block; color: var(--muted); font-size: .72rem; }
      .nav-block { margin-top: 8px; }
      .nav-label {
        padding: 10px 12px 8px; font-size: 0.7rem; letter-spacing: .12em; text-transform: uppercase;
        color: var(--muted-2); font-weight: 700;
      }
      .nav-item {
        width: 100%; display:flex; align-items:center; justify-content:space-between; gap:12px;
        border:1px solid transparent; background:transparent; color:var(--text); border-radius:14px;
        padding:11px 12px; margin:4px 0; cursor:pointer; transition:0.2s ease;
      }
      .nav-item:hover { background: rgba(255,255,255,0.25); border-color: var(--line); transform: translateX(1px); }
      .nav-item.active {
        background: linear-gradient(180deg, rgba(255,255,255,0.75), rgba(255,255,255,0.42));
        border-color: var(--line); box-shadow: var(--shadow);
      }
      html[data-theme="dark"] .nav-item.active { background: rgba(30,41,59,0.8); }
      .nav-main { display:flex; align-items:center; gap:10px; }
      .nav-icon {
        width: 28px; height: 28px; border-radius:9px; display:grid; place-items:center;
        background: var(--soft); color: var(--muted); font-size:.8rem;
      }
      .nav-item.active .nav-icon { background: var(--accent-soft); color: var(--accent); }
      .nav-badge {
        min-width:20px; height:20px; display:inline-flex; align-items:center; justify-content:center;
        border-radius:999px; background: var(--soft); color: var(--muted); font-size:.65rem; padding: 0 6px;
      }
      .content-wrap { min-width: 0; }
      .topbar {
        display:flex; align-items:center; justify-content:space-between; gap:14px; padding:18px 22px 14px;
        border-bottom:1px solid var(--line); background: rgba(243,245,248,0.78); backdrop-filter: blur(14px);
        position: sticky; top:0; z-index:20;
      }
      html[data-theme="dark"] .topbar { background: rgba(11,18,32,0.76); }
      .search-box {
        display:flex; align-items:center; gap:10px; width:100%; max-width:540px; min-width:320px;
        padding:12px 14px; border:1px solid var(--line); border-radius:15px; background: var(--card); box-shadow: var(--shadow);
      }
      .search-box input {
        flex:1; border:none; outline:none; background:transparent; color:var(--text);
      }
      .search-box input::placeholder { color: var(--muted-2); }
      .header-actions { display:flex; align-items:center; gap:12px; }
      .icon-btn {
        width:40px; height:40px; border:1px solid var(--line); background:var(--card); color:var(--text);
        border-radius:12px; display:grid; place-items:center; cursor:pointer; box-shadow:var(--shadow);
      }
      .user-box {
        display:flex; align-items:center; gap:12px; border:1px solid var(--line); background:var(--card);
        border-radius:14px; padding:8px 12px 8px 8px; box-shadow:var(--shadow);
      }
      .avatar {
        width:34px; height:34px; border-radius:10px; background:linear-gradient(135deg,#111827,#374151);
        display:grid; place-items:center; color:white; font-weight:700;
      }
      .user-meta strong { display:block; font-size:0.86rem; }
      .user-meta span { display:block; color:var(--muted); font-size:0.7rem; }
      .page { padding:22px; }
      .crumb {
        margin-bottom:12px; color:var(--muted); font-size:0.74rem; letter-spacing:0.08em; text-transform:uppercase; font-weight:700;
      }
      .hero {
        position: relative; display:flex; align-items:center; justify-content:space-between; gap:20px;
        padding:24px 28px; border-radius:28px; background:linear-gradient(135deg,#111827,#1d2435); color:#fff;
        overflow:hidden; box-shadow: var(--shadow);
      }
      .hero::after {
        content:""; position:absolute; top:-60px; right:-30px; width:240px; height:240px; border-radius:50%;
        background: radial-gradient(circle, rgba(245,158,11,0.46), transparent 62%);
      }
      .hero-copy { position:relative; z-index:1; }
      .live-badge {
        display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:999px;
        background: rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.1); color:#edf3ff;
        font-size:0.7rem; letter-spacing:0.1em; text-transform:uppercase;
      }
      .live-dot { width:8px; height:8px; border-radius:50%; background:#34d399; box-shadow:0 0 0 7px rgba(52,211,153,0.18); }
      .hero h1 { margin:14px 0 8px; font-size: clamp(2rem, 3vw, 3rem); letter-spacing:-0.07em; }
      .hero p { margin:0; color: rgba(255,255,255,0.78); }
      .hero-actions { position:relative; z-index:1; display:flex; gap:12px; }
      .btn {
        border:none; border-radius:12px; padding:12px 16px; font-weight:700; cursor:pointer; transition: transform .18s ease;
      }
      .btn:hover { transform: translateY(-1px); }
      .btn.primary {
        background: linear-gradient(135deg, #f7b552, #f59e0b); color:#1c1d20; box-shadow: 0 16px 26px rgba(245,158,11,0.28);
      }
      .btn.secondary {
        background: rgba(255,255,255,0.08); color:#fff; border:1px solid rgba(255,255,255,0.14);
      }
      .kpis {
        margin-top: 22px; display:grid; grid-template-columns: repeat(6, minmax(150px, 1fr)); gap: 16px;
      }
      .kpi-card {
        border:1px solid var(--line); border-radius:22px; padding:16px 18px 14px; box-shadow: var(--shadow);
        display:flex; flex-direction:column; gap:14px; text-align:left; cursor:pointer;
      }
      .kpi-head { display:flex; align-items:center; justify-content:space-between; gap:8px; }
      .kpi-label { color: var(--muted); font-size:0.7rem; letter-spacing:0.08em; text-transform:uppercase; }
      .kpi-icon {
        width:36px; height:36px; border-radius:12px; display:grid; place-items:center; font-weight:700;
      }
      .kpi-value { font-size: clamp(1.5rem, 1.5vw, 2rem); letter-spacing:-0.06em; font-weight:800; }
      .kpi-meta { display:flex; align-items:center; justify-content:space-between; gap:8px; }
      .delta { display:inline-flex; padding:6px 8px; border-radius:999px; font-size:0.7rem; font-weight:700; }
      .delta.up { background: var(--green-soft); color: var(--green); }
      .delta.down { background: var(--red-soft); color: var(--red); }
      .kpi-sub { color: var(--muted); font-size:0.72rem; }
      .double-grid { margin-top:22px; display:grid; grid-template-columns:1.6fr 1fr; gap:18px; }
      .panel {
        border-radius: 26px; background: var(--card); border:1px solid var(--line); box-shadow: var(--shadow); overflow:hidden;
      }
      .panel-head { display:flex; align-items:center; justify-content:space-between; padding:18px 20px 16px; border-bottom:1px solid var(--line); }
      .panel-head h3 { margin:0; font-size:1.08rem; letter-spacing:-0.04em; }
      .panel-head small { color:var(--muted); }
      .panel-body { padding:18px 20px 20px; }
      .segmented { display:inline-flex; gap:6px; background:var(--soft); border:1px solid var(--line); border-radius:12px; padding:5px; }
      .segmented button {
        border:none; background:transparent; color:var(--muted); padding:7px 10px; border-radius:9px; cursor:pointer; font-weight:700;
      }
      .segmented button.active { background:#fff; color:var(--text); box-shadow:0 8px 16px rgba(15,23,42,0.08); }
      html[data-theme="dark"] .segmented button.active { background: rgba(15,23,42,0.8); }
      .chart-box { height:220px; display:flex; align-items:flex-end; gap:10px; margin-top:12px; }
      .bar-group { flex:1; height:100%; display:flex; align-items:flex-end; justify-content:center; gap:6px; }
      .bar { position:relative; width:18px; border-radius:12px 12px 0 0; min-height:12px; }
      .bar.sales { background: linear-gradient(180deg, #f7c863, #f29f2f); }
      .bar.profit { background: linear-gradient(180deg, #8fe0ad, #3bb877); }
      .bar.orders { background: linear-gradient(180deg, #9cc0ff, #5d8af0); }
      .bar-label { position:absolute; left:50%; bottom:-20px; transform:translateX(-50%); font-size:0.64rem; color:var(--muted); }
      .legend { display:flex; flex-wrap:wrap; gap:14px; margin-top:24px; color:var(--muted); font-size:0.75rem; }
      .legend b { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:middle; }
      .alert-list, .insight-list, .quick-actions { display:grid; gap:12px; }
      .alert-item, .insight-item { display:flex; align-items:center; justify-content:space-between; gap:12px; background: var(--soft); border:1px solid var(--line); border-radius:14px; padding:12px; }
      .alert-left { display:flex; align-items:center; gap:10px; }
      .alert-dot { width:10px; height:10px; border-radius:50%; }
      .alert-text strong { display:block; font-size:0.84rem; }
      .alert-text span { display:block; color:var(--muted); font-size:0.72rem; }
      .tiny-pill { display:inline-flex; padding:6px 8px; border-radius:999px; background: rgba(148,163,184,0.1); color:var(--muted); font-weight:700; font-size:0.68rem; }
      .mid-grid { margin-top:22px; display:grid; grid-template-columns:1.35fr 1fr; gap:18px; }
      .grid-cards { display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:14px; }
      .product-card { padding:12px; border:1px solid var(--line); border-radius:22px; background: var(--card-strong); box-shadow: var(--shadow); }
      .product-image { height:150px; border-radius:18px; position:relative; overflow:hidden; background:linear-gradient(135deg, #e5e7eb, #f9fafb); border:1px solid rgba(17,24,39,0.03); }
      html[data-theme="dark"] .product-image { background: linear-gradient(135deg, #1f2937, #0f172a); }
      .product-image::before {
        content:""; position:absolute; inset:16px 22px 14px 22px; border-radius:20px;
        background: linear-gradient(135deg, rgba(16,163,127,0.14), rgba(59,130,246,0.12));
        transform: perspective(500px) rotateX(18deg) rotateY(-10deg);
      }
      .product-card .tag { margin-top:12px; display:inline-flex; padding:6px 8px; border-radius:999px; background: var(--accent-soft); color: var(--accent); font-weight:700; font-size:0.68rem; }
      .product-card h4 { margin:12px 0 6px; font-size:1rem; letter-spacing:-0.04em; }
      .product-meta { display:flex; align-items:center; justify-content:space-between; color:var(--muted); font-size:0.72rem; }
      .product-bottom { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:14px; }
      .price { font-size:1.2rem; font-weight:800; letter-spacing:-0.06em; }
      .btn-small {
        border:none; background:var(--soft); color:var(--text); border-radius:10px; padding:9px 12px; font-weight:700; cursor:pointer;
      }
      .insight-item { align-items:flex-start; }
      .insight-icon {
        width:30px; height:30px; border-radius:10px; display:grid; place-items:center; background:var(--accent-soft); color:var(--accent);
        font-weight:800;
      }
      .insight-text strong { display:block; margin-bottom:4px; font-size:0.84rem; }
      .insight-text span { color:var(--muted); font-size:0.72rem; }
      .bottom-grid { margin-top:22px; display:grid; grid-template-columns:1.3fr 1fr; gap:18px; }
      table { width:100%; border-collapse:collapse; }
      th, td { text-align:left; padding:13px 12px; border-bottom:1px solid var(--line); }
      th { color:var(--muted); font-size:0.66rem; letter-spacing:0.1em; text-transform:uppercase; }
      td { font-size:0.82rem; }
      .status-tag { display:inline-flex; padding:6px 8px; border-radius:999px; font-size:0.68rem; font-weight:700; }
      .status-tag.success { background: var(--green-soft); color: var(--green); }
      .status-tag.warn { background: var(--red-soft); color: var(--red); }
      .status-tag.info { background: var(--blue-soft); color: var(--blue); }
      .status-tag.neutral { background: var(--soft); color: var(--muted); }
      .quick-btn {
        text-align:left; width:100%; padding:13px 14px; border:1px solid var(--line); background:var(--soft); color:var(--text);
        border-radius:12px; font-weight:700; cursor:pointer;
      }
      .modal-backdrop {
        position: fixed; inset:0; background: rgba(15,23,42,0.52); display:grid; place-items:center; z-index:50; padding:20px;
      }
      .modal {
        width: min(520px, 100%); background: var(--card-strong); border:1px solid var(--line); border-radius:24px; box-shadow: var(--shadow);
        overflow:hidden;
      }
      .modal-head { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:18px 20px; border-bottom:1px solid var(--line); }
      .modal-head h3 { margin:0; font-size:1.1rem; }
      .close-btn { border:none; background: var(--soft); color: var(--text); width:32px; height:32px; border-radius:10px; cursor:pointer; }
      .modal-body { padding:20px; display:grid; gap:14px; }
      .field-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
      .field { display:grid; gap:8px; }
      .field label { font-size:0.72rem; color:var(--muted); font-weight:700; letter-spacing:0.04em; }
      .field input, .field select {
        width:100%; border:1px solid var(--line); background: var(--soft); color:var(--text); border-radius:12px; padding:10px 12px; outline:none;
      }
      .modal-actions { display:flex; justify-content:flex-end; gap:10px; padding-top:8px; }
      @media (max-width: 1080px) {
        .app-shell { grid-template-columns: 1fr; }
        .sidebar { display:none; }
        .kpis { grid-template-columns: repeat(3, minmax(150px, 1fr)); }
        .double-grid, .mid-grid, .bottom-grid { grid-template-columns:1fr; }
      }
      @media (max-width: 620px) {
        .topbar { padding:14px 16px; }
        .search-box { min-width:0; }
        .page { padding:16px; }
        .hero { flex-direction:column; align-items:flex-start; }
        .hero-actions { width:100%; }
        .hero-actions .btn { flex:1; }
        .kpis { grid-template-columns: repeat(2, minmax(120px,1fr)); }
        .grid-cards { grid-template-columns: 1fr; }
        .field-grid { grid-template-columns:1fr; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="/vendor/react.production.min.js"></script>
    <script src="/vendor/react-dom.production.min.js"></script>
    <script>
      const { useState, useMemo, useEffect } = React;
      const dashboardMenu = [
        { key: 'overview', label: 'Dashboard', icon: '⌂' },
        { key: 'products', label: 'Products', icon: '◫' },
        { key: 'inventory', label: 'Inventory', icon: '▤' },
        { key: 'orders', label: 'Orders', icon: '◭' },
        { key: 'inquiries', label: 'Inquiries', icon: '✦' },
        { key: 'customers', label: 'Customers', icon: '◎' },
        { key: 'suppliers', label: 'Suppliers', icon: '◍' },
        { key: 'billing', label: 'Billing', icon: '▣' },
        { key: 'reports', label: 'Reports', icon: '▨' },
        { key: 'settings', label: 'Settings', icon: '⚙' }
      ];

      function loadShared(key, fallback) {
        try {
          const raw = localStorage.getItem(key);
          return raw ? JSON.parse(raw) : fallback;
        } catch (e) {
          return fallback;
        }
      }

      function saveShared(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
        } catch (e) {}
      }

      function money(value) {
        const n = Number(value || 0);
        return 'Rs ' + n.toLocaleString('en-IN', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
      }

      function asNumber(value) {
        const parsed = Number(String(value ?? 0).replace(/[^0-9.\-]/g, ''));
        return Number.isFinite(parsed) ? parsed : 0;
      }

      function KpiCard({ title, value, delta, tone, icon, subtitle }) {
        const palette = {
          primary: { bg: 'var(--soft)', iconBg: 'var(--primary-soft)', text: 'var(--text)' },
          green: { bg: 'var(--green-soft)', iconBg: 'var(--green-soft)', text: 'var(--green)' },
          blue: { bg: 'var(--blue-soft)', iconBg: 'var(--blue-soft)', text: 'var(--blue)' },
          amber: { bg: 'var(--accent-soft)', iconBg: 'var(--accent-soft)', text: 'var(--accent)' },
          red: { bg: 'var(--red-soft)', iconBg: 'var(--red-soft)', text: 'var(--red)' },
          purple: { bg: 'var(--purple-soft)', iconBg: 'var(--purple-soft)', text: 'var(--purple)' }
        };
        const style = palette[tone] || palette.primary;
        return React.createElement(
          'button',
          { className: 'kpi-card', style: { background: style.bg } },
          React.createElement('div', { className: 'kpi-head' }, React.createElement('span', { className: 'kpi-label' }, title), React.createElement('span', { className: 'kpi-icon', style: { background: style.iconBg, color: style.text } }, icon)),
          React.createElement('div', { className: 'kpi-value', style: { color: style.text } }, value),
          React.createElement('div', { className: 'kpi-meta' }, React.createElement('span', { className: `delta ${delta >= 0 ? 'up' : 'down'}` }, `${delta >= 0 ? '+' : ''}${delta}%`), React.createElement('span', { className: 'kpi-sub' }, subtitle))
        );
      }

      function StatusTag({ kind, children }) {
        return React.createElement('span', { className: `status-tag ${kind}` }, children);
      }

      function PremiumApp() {
        const [theme, setTheme] = useState(() => loadShared('bw_theme', 'light'));
        const [menu, setMenu] = useState('overview');
        const [search, setSearch] = useState('');
        const [modal, setModal] = useState(null);
        const [draftProduct, setDraftProduct] = useState({ name: '', brand: '', model: '', sku: '', price: '', stock: '', category: 'Hydraulics' });
        const [draftInvoice, setDraftInvoice] = useState({ invoiceNo: '', customer: '', total: '', method: 'Cash' });

        const [parts, setParts] = useState(() => loadShared('bw_parts', [
          { id: 'p1', name: 'Hydraulic Pump', brand: 'Bosch', model: 'HP-240', sku: 'HP-240', price: 14500, stock: 12, category: 'Hydraulics' },
          { id: 'p2', name: 'Engine Oil Filter', brand: 'Mahindra', model: 'OF-18', sku: 'OF-18', price: 860, stock: 28, category: 'Filters' },
          { id: 'p3', name: 'Brake Pad Set', brand: 'Brembo', model: 'BP-34', sku: 'BP-34', price: 3200, stock: 4, category: 'Brakes' },
          { id: 'p4', name: 'Radiator Hose', brand: 'Apex', model: 'RH-91', sku: 'RH-91', price: 1880, stock: 9, category: 'Cooling' },
          { id: 'p5', name: 'Alternator Belt', brand: 'Gates', model: 'AB-52', sku: 'AB-52', price: 2100, stock: 6, category: 'Drive' },
