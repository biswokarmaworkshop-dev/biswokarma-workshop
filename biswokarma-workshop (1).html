      /* number to words (Indian numbering: crore / lakh) */
      function numberToWords(num) {
        num = Math.round(num);
        if (num === 0) return "Zero";
        const a = [
          "",
          "One",
          "Two",
          "Three",
          "Four",
          "Five",
          "Six",
          "Seven",
          "Eight",
          "Nine",
          "Ten",
          "Eleven",
          "Twelve",
          "Thirteen",
          "Fourteen",
          "Fifteen",
          "Sixteen",
          "Seventeen",
          "Eighteen",
          "Nineteen",
        ];
        const b = [
          "",
          "Twenty",
          "Thirty",
          "Forty",
          "Fifty",
          "Sixty",
          "Seventy",
          "Eighty",
          "Ninety",
        ];
        function two(n) {
          return n < 20
            ? a[n]
            : b[Math.floor(n / 10)] + (n % 10 ? " " + a[n % 10] : "");
        }
        function three(n) {
          let s = "";
          if (n >= 100) {
            s += a[Math.floor(n / 100)] + " Hundred";
            n %= 100;
            if (n) s += " ";
          }
          if (n) s += two(n);
          return s;
        }
        let crore = Math.floor(num / 10000000);
        num %= 10000000;
        let lakh = Math.floor(num / 100000);
        num %= 100000;
        let thousand = Math.floor(num / 1000);
        num %= 1000;
        const parts = [];
        if (crore) parts.push(three(crore) + " Crore");
        if (lakh) parts.push(three(lakh) + " Lakh");
        if (thousand) parts.push(three(thousand) + " Thousand");
        if (num) parts.push(three(num));
        return parts.join(" ");
      }

      function Tilt({ children, className, style }) {
        const onMove = (e) => {
          const card = e.currentTarget;
          const r = card.getBoundingClientRect();
          const x = e.clientX - r.left,
            y = e.clientY - r.top;
          const rx = (y / r.height - 0.5) * -10;
          const ry = (x / r.width - 0.5) * 10;
          card.style.transform = `perspective(800px) rotateX(${rx}deg) rotateY(${ry}deg) translateZ(4px)`;
        };
        const onLeave = (e) => {
          e.currentTarget.style.transform =
            "perspective(800px) rotateX(0deg) rotateY(0deg) translateZ(0)";
        };
        return React.createElement(
          "div",
          {
            className: "tilt " + (className || ""),
            style: style,
            onMouseMove: onMove,
            onMouseLeave: onLeave,
          },

      function Purchases({

        const [form, setForm] = useState({
          supplier: "",

          cost: "",
          paid: "",
        });
        const submit = (event) => {
          event.preventDefault();
          if (!form.supplier || !form.product || Number(form.quantity) <= 0)
            return;
          const existing = parts.find(
            (part) =>
              part.name.toLowerCase() === form.product.trim().toLowerCase(),
          );
          const next = existing
            ? parts.map((part) =>
                part.id === existing.id
                  ? {
                      ...part,
                      stock: Number(part.stock || 0) + Number(form.quantity),
                      price: Number(form.cost) || part.price,
                    }
                  : part,
              )
            : [
                {
                  id: uid(),
                  name: form.product.trim(),
                  category: "General",
                  machine: "Universal",
                  price: Number(form.cost) || 0,
                  stock: Number(form.quantity),
                },
                ...parts,
              ];
          persistParts(next);
          const total = (Number(form.cost) || 0) * Number(form.quantity);
          persistPurchases([
            {
              id: uid(),
              date: todayStr(),
              supplier: form.supplier.trim(),
              product: form.product.trim(),
              quantity: Number(form.quantity),
              unitCost: Number(form.cost) || 0,
              total,
              paid: Math.min(total, Number(form.paid) || 0),
              due: Math.max(0, total - (Number(form.paid) || 0)),
            },
            ...purchases,
          ]);
          flash(
            `Purchase received from ${form.supplier}; stock increased by ${form.quantity}.`,
          );
          setForm({

            product: "",
            quantity: 1,
            cost: "",
            paid: "",

      function Payments({ bills, persistBills, customers, flash }) {
        const [providers, setProviders] = React.useState({});
        const [paying, setPaying] = React.useState(null);
        React.useEffect(() => {
          fetch("/api/payments/providers").then(r => r.json()).then(d => setProviders(d.providers || {})).catch(() => {});
        }, []);
        const markPaid = (id) => {
          persistBills(
            bills.map((bill) =>
              bill.id === id ? { ...bill, paid: Number(bill.total || 0), due: 0, paymentStatus: "Paid", paymentMethod: "Cash" } : bill,
            ),
          );
          flash("Payment recorded and outstanding balance updated.");
        };
        const payViaEsewa = async (bill) => {
          setPaying(bill.id);
          try {
            const res = await fetch("/api/payments/orders", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                provider: "esewa",
                customerName: (bill.customer && bill.customer.name) || "Walk-in",
                customerPhone: (bill.customer && bill.customer.phone) || "0000000000",
                amount: bill.due,
                vat: 0,
              }),
            });
            const data = await res.json();
            if (data.esewaUrl) {
              persistBills(
                bills.map((b) => b.id === bill.id ? { ...b, paymentMethod: "eSewa", paymentStatus: "Pending" } : b),
              );
              window.open(data.esewaUrl, "_blank");
              flash("eSewa payment window opened. Customer should complete payment there.");
            } else {
              flash(data.error || "eSewa is not configured yet. Add ESEWA_MERCHANT_CODE and ESEWA_SECRET_KEY in Render.");
            }
          } catch (e) {
            flash("Payment error: " + e.message);
          } finally {
            setPaying(null);
          }
        };
        const markBankTransfer = (id) => {
          persistBills(
            bills.map((bill) =>
              bill.id === id ? { ...bill, paymentMethod: "Bank Transfer", paymentStatus: "Pending" } : bill,
            ),
          );
          flash("Marked as Bank Transfer. Verify payment manually.");
        };
        const pending = bills.filter((bill) => Number(bill.due || 0) > 0);
        return React.createElement(
          "div",
          { className: "modulePanel" },
          React.createElement(

      function Financial({ bills, parts }) {
        const now = new Date();
        const todayS = todayStr();
        const startOfWeek = new Date(now);
        startOfWeek.setDate(now.getDate() - 6);
        const monthPrefix = todayS.slice(0, 7);
        const yearPrefix = todayS.slice(0, 4);
        const sum = (arr) => arr.reduce((s, b) => s + b.total, 0);
        const todayTotal = sum(bills.filter((b) => b.date === todayS));
        const weekTotal = sum(
          bills.filter((b) => new Date(b.date) >= startOfWeek),
        );
        const monthTotal = sum(
          bills.filter((b) => b.date.startsWith(monthPrefix)),
        );
        const yearTotal = sum(
          bills.filter((b) => b.date.startsWith(yearPrefix)),
        );
        const stockUnits = parts.reduce(
          (total, part) => total + Number(part.stock || 0),
          0,
        );
        const stockValue = parts.reduce(
          (total, part) =>
            total + Number(part.stock || 0) * parseMoney(part.price),
          0,
        );
        const estimatedProfit = bills.reduce(
          (total, bill) => total + Number(bill.total || 0) * 0.3,
          0,
        );
        const last7 = [];
        for (let i = 6; i >= 0; i--) {
          const d = new Date(now);
          d.setDate(now.getDate() - i);
          const ds = d.toISOString().slice(0, 10);
          last7.push({
            label: ds.slice(5),
            total: sum(bills.filter((b) => b.date === ds)),

        const maxDay = Math.max(1, ...last7.map((d) => d.total));

          {

      function Stock({ parts, persistParts, flash }) {
        const [q, setQ] = useState("");
        const [page, setPage] = useState(1);
        const perPage = 20;
        const [newPart, setNewPart] = useState({
          name: "",
          category: "",
          machine: "",
          price: "",
          stock: "",
          image: "",
        });
        const [bulkText, setBulkText] = useState("");
        const [showBulk, setShowBulk] = useState(false);
        const filtered = parts.filter(
          (p) =>
            p.name.toLowerCase().includes(q.toLowerCase()) ||
            p.machine.toLowerCase().includes(q.toLowerCase()),
        );
        const pageCount = Math.max(1, Math.ceil(filtered.length / perPage));
        const shown = filtered.slice((page - 1) * perPage, page * perPage);
        const addPart = (e) => {
          e.preventDefault();
          if (!newPart.name || !newPart.category) return;
          persistParts([
            {
              id: uid(),
              ...newPart,
              price: parseMoney(newPart.price),
              stock: Number(newPart.stock) || 0,
              image: newPart.image.trim(),
            },
            ...parts,
          ]);
          setNewPart({
            name: "",
            category: "",
            machine: "",
            price: "",
            stock: "",
            image: "",
          });
          flash("Part added.");
        };
        const bulkAdd = () => {
          const lines = bulkText
            .split("\n")
            .map((l) => l.trim())
            .filter(Boolean);
          const added = [];
          lines.forEach((line) => {
            const cols = line.split(",").map((c) => c.trim());
            if (cols.length < 2) return;
            const [name, category, machine, price, stock] = cols;
            added.push({
              id: uid(),
              name,
              category: category || "General",
              machine: machine || "Universal",
              price: parseMoney(price || 0),
              stock: Number(stock) || 0,
            });
          });
          if (added.length) {
            persistParts([...added, ...parts]);
            flash(`${added.length} parts added in bulk.`);
            setBulkText("");

      function NewBill({

        invoiceSeq,
        persistSeq,
        bills,
        persistBills,
        onCreated,
      }) {
        const [customer, setCustomer] = useState({
          name: "",

        });
        const [payment, setPayment] = useState({
          method: "cash",

        });
        const [rows, setRows] = useState([]);
        const [partQuery, setPartQuery] = useState("");
        const [showPicker, setShowPicker] = useState(false);
        const addFromStock = (part) => {
          setRows([
            ...rows,
            {
              id: uid(),
              source: "stock",
              partId: part.id,
              description: part.name,
              qty: 1,
              rate: parseMoney(part.price),
            },
          ]);
          setShowPicker(false);
          setPartQuery("");
        };
        const addCustomRow = () =>
          setRows([
            ...rows,
            {
              id: uid(),
              source: "custom",
              description: "",
              qty: 1,
              rate: 0,
            },
          ]);
        const updateRow = (id, field, val) =>
          setRows(
            rows.map((r) =>
              r.id === id
                ? {
                    ...r,
                    [field]: val,
                  }
                : r,
            ),
          );
        const removeRow = (id) => setRows(rows.filter((r) => r.id !== id));
        const subtotal = rows.reduce(
          (s, r) => s + (Number(r.qty) || 0) * (Number(r.rate) || 0),
          0,
        );
        const vat = subtotal * VAT_RATE;
        const total = subtotal + vat;
        const valid =
          customer.name.trim() &&
          rows.length > 0 &&
          rows.every((r) => r.description && Number(r.qty) > 0);
        const matches = parts
          .filter((p) => p.name.toLowerCase().includes(partQuery.toLowerCase()))
          .slice(0, 30);
        const generate = () => {
          if (!valid) return;
          const invoiceNo = "INV-" + String(invoiceSeq).padStart(4, "0");
          const bill = {
            id: uid(),
            invoiceNo,
            date: todayStr(),
            customer,
            paymentMethod: payment.method,
            paid: Math.min(total, Number(payment.paidAmount) || 0),
            due: Math.max(0, total - (Number(payment.paidAmount) || 0)),
            paymentStatus:
              (Number(payment.paidAmount) || 0) >= total ? "Paid" : "Due",
            items: rows.map((r) => ({
              description: r.description,
              qty: Number(r.qty),
              rate: Number(r.rate),
            })),
            subtotal,
            vat,
            total,
          };
          // decrement stock for items sourced from inventory
          const updatedParts = parts.map((p) => {
            const used = rows
              .filter((r) => r.source === "stock" && r.partId === p.id)
              .reduce((s, r) => s + Number(r.qty), 0);
            return used
              ? {
                  ...p,
                  stock: Math.max(0, p.stock - used),
                }
              : p;
          });
          persistParts(updatedParts);
          persistBills([bill, ...bills]);
          persistSeq(invoiceSeq + 1);
          onCreated(bill);
        };
        return React.createElement(

      function Settings({ role, auth, persistAuth, flash }) {
        const acc = auth[role];
        const [theme, setTheme] = useState(loadShared("bw_theme", "dark"));
        const [showPassword, setShowPassword] = useState(false);
        const [showConfirm, setShowConfirm] = useState(false);
        const [form, setForm] = useState({
          username: acc.username,
          password: "",
          confirm: "",
        });
        const [err, setErr] = useState("");
        useEffect(() => {
          document.documentElement.dataset.theme = theme;
        }, [theme]);
        const submit = (e) => {
          e.preventDefault();
          if (form.password && form.password !== form.confirm)
            return setErr("Passwords do not match.");
          const next = {
            ...auth,
            [role]: {
              ...acc,
              username: form.username || acc.username,
              password: form.password ? form.password : acc.password,
            },
          };
          persistAuth(next);
          setErr("");
          setForm({
            ...form,
            password: "",
            confirm: "",
          });
          flash("Login details updated.");
        };
        const backupKeys = [
          "bw_auth",
          "bw_parts",
          "bw_inquiries",
          "bw_customers",
          "bw_suppliers",
          "bw_purchases",
          "bw_bills",
          "bw_invoice_seq",
          "bw_bank_accounts",
          "bw_bank_transactions",
          "bw_audit",
          "bw_theme",
        ];
        const backupStateKeys = {
          bw_invoice_seq: "invoiceSeq",
          bw_bank_accounts: "bankAccounts",
          bw_bank_transactions: "bankTransactions",
        };
        const digestBackup = async (value) => {
          if (!window.crypto || !window.crypto.subtle) return null;
          const bytes = new TextEncoder().encode(JSON.stringify(value));
          const digest = await window.crypto.subtle.digest("SHA-256", bytes);
          return Array.from(new Uint8Array(digest))
            .map((byte) => byte.toString(16).padStart(2, "0"))
            .join("");
        };
        const exportBackup = async () => {
          const backup = {
            app: "biswokarma-workshop",
            version: 2,
            exportedAt: new Date().toISOString(),
            data: {},
          };
          backupKeys.forEach((key) => {
            backup.data[key] = loadShared(key, null);
          });
          backup.integrity = await digestBackup(backup.data);
          const blob = new Blob([JSON.stringify(backup, null, 2)], {
            type: "application/json",
          });
          const link = document.createElement("a");
          link.href = URL.createObjectURL(blob);
          link.download = `biswokarma-backup-${todayStr()}.json`;
          link.click();
          URL.revokeObjectURL(link.href);
          flash("Verified backup downloaded.");
        };
        const importBackup = (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = async () => {
            try {
              const backup = JSON.parse(reader.result);
              if (
                !backup ||
                backup.app !== "biswokarma-workshop" ||
                !backup.data ||
                typeof backup.data !== "object"
              )
                throw new Error("Unsupported backup format");
              if (backup.integrity) {
                const actual = await digestBackup(backup.data);
                if (actual && actual !== backup.integrity)
                  throw new Error("Backup integrity check failed");
              }
              if (
                !window.confirm(
                  "Restore this backup? Existing local records will be replaced.",
                )
              )
                return;
              backupKeys.forEach((key) => {
                if (backup.data[key] !== undefined) {
                  saveShared(key, backup.data[key]);
                  syncDatabase(
                    backupStateKeys[key] || key.replace(/^bw_/, ""),
                    backup.data[key],
                  );
                }
              });
              flash("Verified backup restored. Reloading records...");
              setTimeout(() => window.location.reload(), 450);
            } catch (error) {
              flash(`Backup rejected: ${error.message || "invalid file"}.`);
            }
          };
          reader.readAsText(file);
        };
        return React.createElement(
          "div",
          null,
          React.createElement(

      /* Metallic workshop theme - default is dark */
      :root, [data-theme="dark"] { --ink: #070809; --steelDark: #111417; --amber: #d4a72c; --amber2: #ffe28a; --rust: #9b7418; --paper: #111417; --steel: #aeb6bd; --text: #d9dde0; --silver: #e5e9ec; }
      [data-theme="light"] { --ink: #16181A; --steelDark: #232522; --amber: #F5B700; --amber2: #FFD873; --rust: #C1440E; --paper: #EDEAE1; --steel: #8A8D91; --text: #3D3B36; --silver: #e5e9ec; }
      [data-theme="dark"] .app, [data-theme="dark"] .app, .app { background: radial-gradient(circle at 50% -10%, #283038 0, #111417 34%, #070809 78%); color: var(--text); }
      [data-theme="light"] .app { background: var(--paper); color: var(--text); }
      [data-theme="dark"] .app h1, [data-theme="dark"] .app h2, [data-theme="dark"] .app h3 { color: var(--silver); text-shadow: 0 2px 12px rgba(0,0,0,.65); }
      [data-theme="dark"] .topbar, [data-theme="dark"] .foot { background: linear-gradient(110deg, #050607, #252b30 48%, #090a0b); box-shadow: 0 8px 26px rgba(0,0,0,.38); }
      [data-theme="dark"] .navlinks button.active, [data-theme="dark"] .toast { background: linear-gradient(135deg, var(--amber2), var(--amber)); color: #12100a; box-shadow: 0 0 18px rgba(212,167,44,.28); }
      [data-theme="light"] .app h1, [data-theme="light"] .app h2, [data-theme="light"] .app h3 { color: var(--text); text-shadow: none; }
      [data-theme="light"] .topbar, [data-theme="light"] .foot { background: linear-gradient(110deg, #2c3440, #3d4a55 48%, #2c3440); box-shadow: 0 4px 12px rgba(0,0,0,.15); }
      [data-theme="light"] .navlinks button.active, [data-theme="light"] .toast { background: linear-gradient(135deg, var(--amber2), var(--amber)); color: #12100a; box-shadow: 0 0 8px rgba(212,167,44,.15); }
      .hero { position: relative; overflow: hidden; border: 1px solid rgba(229,233,236,.18); box-shadow: 0 22px 50px rgba(0,0,0,.38), inset 0 1px rgba(255,255,255,.08); }
      .animatedGradient { background: radial-gradient(circle at 82% 42%, rgba(212,167,44,.16), transparent 28%), linear-gradient(135deg, #0b0d0f, #252b30 50%, #0b0d0f); background-size: 180% 180%; animation: gradientShift 12s ease infinite; }
      .heroText p, .processStep p { color: #c3c9ce; }
      .heroArt { filter: drop-shadow(0 24px 22px rgba(0,0,0,.52)); perspective: 800px; }
      .sunEmblem { overflow: visible; transform-style: preserve-3d; animation: emblemFloat 6s ease-in-out infinite; }
      .sunCoreGroup { transform-origin: 0 0; animation: sunRotate 18s linear infinite; }
      @keyframes emblemFloat { 0%, 100% { transform: translateY(0) rotateX(0deg) rotateY(0deg); } 50% { transform: translateY(-9px) rotateX(4deg) rotateY(-5deg); } }
      @keyframes sunRotate { to { transform: translate(160px,160px) rotate(360deg); } }
      [data-theme="dark"] .serviceCard, [data-theme="dark"] .partCard, [data-theme="dark"] .chartCard, [data-theme="dark"] .tableWrap, [data-theme="dark"] .invoicePaper, [data-theme="dark"] .pickerBox, [data-theme="dark"] .settingsPanel, [data-theme="dark"] .bankForm { background: linear-gradient(145deg, #20262a, #0d0f11); border-color: rgba(229,233,236,.2); box-shadow: 0 12px 26px rgba(0,0,0,.3), inset 0 1px rgba(255,255,255,.06); }
      [data-theme="light"] .serviceCard, [data-theme="light"] .partCard, [data-theme="light"] .chartCard, [data-theme="light"] .tableWrap, [data-theme="light"] .invoicePaper, [data-theme="light"] .pickerBox, [data-theme="light"] .settingsPanel, [data-theme="light"] .bankForm { background: #fff; border-color: #e0e0e0; box-shadow: 0 4px 12px rgba(0,0,0,.08); color: #333; }
